.list{display:grid;gap:16px}

// tabs
function go(v){const i=['news','me','set'].indexOf(v);$('#ind').style.transform=`translateX(${i*100}%)`;$$('.view').forEach(e=>e.classList.toggle('on',e.id===v));$$('nav button').forEach((b,j)=>b.style.opacity=j===i?1:.55);if(v==='me')renderMe()}
$$('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));

function ui(){const t=tx();document.documentElement.lang=L;document.title=t.name;
 const lg=$('#logo');lg.classList.add('sw');setTimeout(()=>{lg.textContent=t.name;lg.classList.remove('sw')},250);
 $$('nav button').forEach((b,i)=>b.textContent=t.tabs[i]);
 $('#pill').textContent=t.pill;$('#q').placeholder=t.sp;renderSrc();
 $('#lh').textContent=t.lang;renderOpts();
 $$('#langs .btn').forEach(b=>b.classList.toggle('on',b.dataset.l===L));renderCats();renderMe();setBanners()}

// banners (president banner follows newest news)
function bannerLines(){const t=tx();const lines=[];const p=A.find(a=>a.banner&&a.banner.length);
 lines.push(p?p.banner:t.def);
 if(A[0])lines.push([A[0].t.slice(0,48)+(A[0].t.length>48?'…':''),'']);
 return lines}
function setBanners(){clearInterval(banTimer);const ls=bannerLines();banIdx=0;show(ls[0]);
 if(ls.length>1)banTimer=setInterval(()=>{banIdx=(banIdx+1)%ls.length;const e=$('#bt');e.classList.add('o');setTimeout(()=>{show(ls[banIdx]);e.classList.remove('o')},450)},5000)}
function show(l){$('#bt').innerHTML=l.filter(Boolean).join('<br>')}
$('#banner').onclick=()=>{const p=A.find(a=>a.banner&&a.banner.length)||A[0];if(p)open(A.indexOf(p))};

// data
async function load(force){
 ERR='';let sample=false;lastTry=Date.now();LD=today();
 const key=`news2_${L}_${today()}`;let d=!force&&S.get(key,null);
 $('#list').innerHTML=`<div class="load">${tx().load}</div>`;
 if(!d)sample=true,d=SAMPLE[L].map((a,i)=>({...a,banner:i===0?(L==='bg'?['Нов закон: велоалеи','Какво мислите вие?']:['New law: bike lanes','What do you think?']):null}));
 d=d.map((a,i)=>({...a,date:a.d||a.date||today(),id:today()+L+i,w:a.w||pick(L==='bg'?NAMES:NAMES_EN)}));
 S.set(key,d);sampleShown=false;AI=d;rebuild();try{Object.keys(localStorage).filter(k=>k.startsWith('es_news')&&!k.includes(today())).forEach(k=>localStorage.removeItem(k))}catch(e){}
 renderList();setBanners();fetchImgs()}
async function fetchImgs(){const pk=PIXABAY_KEY||S.get('gk','');if(!pk)return;
 for(const a of A){if(a.img||a.u)continue;try{const r=await fetch(`https://pixabay.com/api/?key=${pk}&q=${encodeURIComponent(a.q||a.t)}&image_type=photo&orientation=horizontal&safesearch=true&per_page=3`);const j=await r.json();if(j.hits&&j.hits[0]){a.img=j.hits[0].webformatURL;const e=document.querySelector(`[data-i="${A.indexOf(a)}"] .im`);if(e){e.style.backgroundImage=`url("${a.img}")`;e.textContent=''}}}catch(e){}}
 S.set(`news2_${L}_${today()}`,AI)}

function renderCats(){const c=CATN[L],t=tx();const used=[...new Set(A.map(a=>a.c))];
 $('#cats').innerHTML=`<button data-c="all" class="${cat==='all'?'on':''}">${t.all}</button>`+used.map(k=>`<button data-c="${k}" class="${cat===k?'on':''}">${c[k]||k}</button>`).join('');
 $$('#cats button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderCats();renderList()})}
function renderList(){const t=tx();renderCats();
 $('#list').innerHTML=A.map((a,i)=>({a,i})).filter(x=>(cat==='all'||x.a.c===cat)&&(SRC==='all'||(SRC==='ai')===!x.a.u)&&(!Q||(x.a.t+' '+x.a.b+' '+x.a.w).toLowerCase().includes(Q))).map((x,n)=>`<div class="card" data-i="${x.i}" style="animation-delay:${n*70}ms">
  <div class="im" style="${x.a.img?`background-image:url('${x.a.img}')`:''}">${x.a.img?'':EMO[x.a.c]||'📰'}</div>
  <div class="tx">${x.a.hot?`<span class="hot">${t.hot}</span>`:''}<h3 style="${x.a.hot?'margin-top:22px':''}">${esc(x.a.t)}</h3><small>${t.by} ${esc(x.a.w)} · ${x.a.u?'✍️ '+t.writer:t.auth}<br>${CATN[L][x.a.c]||''} · 📅 ${fd(x.a.date)}</small></div></div>`).join('');
 if(ERR)$('#list').insertAdjacentHTML('afterbegin',`<div class="empty">⚠️ ${esc(ERR)}</div>`);
 if(!$('#list').children.length)$('#list').innerHTML=`<div class="empty">${t.nodata}</div>`;
 $$('.card').forEach(c=>c.onclick=()=>open(+c.dataset.i))}
const fd=d=>new Date(d+'T12:00:00').toLocaleDateString(L==='bg'?'bg-BG':'en-GB',{day:'numeric',month:'long',year:'numeric'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// article + comments
const CM=()=>S.get('cm',{});
function open(i){cur=i;const a=A[i],t=tx();
 $('#sh').innerHTML=`<button class="x" id="cx">✕</button>
 <div class="hero" style="${a.img?`background-image:url('${a.img}')`:''}">${a.img?'':EMO[a.c]||'📰'}</div>
 <h2>${esc(a.t)}</h2><div class="meta">${t.by} ${esc(a.w)} · ${a.u?'✍️ '+t.writer:t.auth} · 📅 ${fd(a.date)}</div>
 ${a.b.split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join('')}
 <h4 style="margin-top:16px">${t.cm}</h4><div id="cl"></div>
 <div class="row"><input id="ci" placeholder="${t.ph}"><button class="btn" id="cs">${t.send}</button></div>`;
 $('#md').classList.add('on');drawCm();
 $('#cx').onclick=close;$('#cs').onclick=addCm;$('#ci').onkeydown=e=>{if(e.key==='Enter')addCm()}}
function close(){$('#md').classList.remove('on')}
$('#md').onclick=e=>{if(e.target.id==='md')close()};
function drawCm(){const l=(CM()[A[cur].id]||[]);$('#cl').innerHTML=l.length?l.map(c=>`<div class="cm"><b>${esc(c.n)}</b><br>${esc(c.x)}</div>`).join(''):`<div class="meta">${tx().none}</div>`}
function addCm(){const v=$('#ci').value.trim();if(!v)return;const all=CM(),id=A[cur].id;(all[id]=all[id]||[]).push({n:S.get('me','')||tx().guest,x:v,t:A[cur].t});S.set('cm',all);$('#ci').value='';drawCm()}
// writers & accounts (stored on this device)
const hs=x=>{let h=5381;for(const c of String(x))h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};
const UA=()=>S.get('uart',[]);
function rebuild(){A=AI.concat(UA())}
function renderSrc(){const t=tx();$('#src').innerHTML=[['all',t.sa],['ai',t.sai],['user',t.sur]].map(([v,l])=>`<button class="btn ${SRC===v?'on':''}" data-s="${v}">${l}</button>`).join('')}
$('#src').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;SRC=b.dataset.s;renderSrc();renderList()};
function renderMe(){const t=tx(),me=S.get('me','');let h='';
 if(!me){h=`<div class="box glass" style="margin-top:18px;text-align:center"><div class="av">?</div><h4>${t.join}</h4>
  <div class="lang" style="margin:10px 0"><button class="btn ${AM==='up'?'on':''}" data-m="up">${t.su}</button><button class="btn ${AM==='in'?'on':''}" data-m="in">${t.li}</button></div>
  <input id="un" maxlength="20" placeholder="${t.un}" autocomplete="username"><input id="pw" type="password" placeholder="${t.pw}" style="margin-top:10px" autocomplete="current-password">
  <div id="mm" class="meta" style="margin:8px 0;color:#d62612"></div><button class="btn" data-m="go" style="width:100%">${AM==='up'?t.su:t.li}</button></div>`}
 else{const mine=UA().filter(a=>a.w===me);
  h=`<div class="box glass" style="margin-top:18px;text-align:center"><div class="av">${esc(me[0].toUpperCase())}</div><h3>${esc(me)}</h3><div class="meta">✍️ ${t.writer}</div>
  <div class="row"><button class="btn" data-m="write" style="flex:1">${t.write}</button><button class="btn" data-m="out" style="flex:none;background:var(--inp);color:var(--ink)">${t.out}</button></div></div>
  <div class="box glass"><h4>${t.myart}</h4>${mine.length?mine.map(a=>`<div class="cm"><b>${esc(a.t)}</b><br><small>📅 ${fd(a.date)}</small> <button class="btn" data-m="del" data-id="${a.id}" style="padding:4px 10px;font-size:12px;float:right">${t.del}</button></div>`).join(''):`<div class="meta">${t.none}</div>`}</div>`}
 const mc=Object.values(CM()).flat().filter(c=>c.n===(me||t.guest));
 h+=`<div class="box glass"><h4>${t.my}</h4>${mc.length?mc.slice().reverse().map(c=>`<div class="cm"><small>${esc(c.t||'')}</small><br>${esc(c.x)}</div>`).join(''):`<div class="meta">${t.none}</div>`}</div>`;
 $('#meBox').innerHTML=h}
$('#meBox').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m,t=tx();
 if(m==='up'||m==='in'){AM=m;renderMe();return}
 if(m==='go'){const n=$('#un').value.trim(),p=$('#pw').value,U=S.get('users',{});
  if(n.length<2||p.length<4||/^__/.test(n)){$('#mm').textContent=t.e3;return}
  if(AM==='up'){if(Object.prototype.hasOwnProperty.call(U,n)){$('#mm').textContent=t.e1;return}U[n]={h:hs(p)};S.set('users',U)}
  else if(!Object.prototype.hasOwnProperty.call(U,n)||U[n].h!==hs(p)){$('#mm').textContent=t.e2;return}
  S.set('me',n);renderMe();return}
 if(m==='out'){S.set('me','');renderMe();return}
 if(m==='write'){editor();return}
 if(m==='del'){S.set('uart',UA().filter(a=>a.id!==b.dataset.id));rebuild();renderList();renderMe()}};
function editor(){const t=tx();cur=null;
 $('#sh').innerHTML=`<button class="x" id="cx">✕</button><h2>${t.write}</h2>
 <input id="et" maxlength="100" placeholder="${t.ttl}" style="margin-top:10px"><select id="ec" style="margin-top:10px">${Object.keys(CATN[L]).map(k=>`<option value="${k}">${CATN[L][k]}</option>`).join('')}</select>
 <textarea id="eb" rows="9" maxlength="6000" placeholder="${t.txt}" style="margin-top:10px"></textarea>
 <input id="ei" placeholder="${t.img}" style="margin-top:10px"><div id="em" class="meta" style="margin:8px 0;color:#d62612"></div><button class="btn" id="ep" style="width:100%">${t.pub}</button>`;
 $('#md').classList.add('on');$('#cx').onclick=close;
 $('#ep').onclick=()=>{const ti=$('#et').value.trim(),bo=$('#eb').value.trim(),im=$('#ei').value.trim();
  if(ti.length<5||bo.length<20){$('#em').textContent=t.e4;return}
  const a={id:'u'+Date.now(),t:ti,b:bo,c:$('#ec').value,w:S.get('me',''),date:today(),u:1,q:ti};
  if(/^https?:\/\/[^\s'"()<>]+$/.test(im))a.img=im;
  S.set('uart',[a,...UA()].slice(0,100));rebuild();SRC='user';cat='all';renderSrc();renderList();close();go('news')}}

// search
function sOpen(on){go('news');$('#sb').classList.toggle('on',on);if(on)setTimeout(()=>$('#q').focus(),300);else{Q='';$('#q').value='';renderList()}}
$('#sbtn').onclick=()=>sOpen(!$('#sb').classList.contains('on')||!$('#news').classList.contains('on'));
$('#q').oninput=e=>{Q=e.target.value.trim().toLowerCase();renderList()};
$('#qx').onclick=()=>sOpen(false);
// look & feel
const ACC=['#000000','#d62612','#00966e','#1e6fff','#7a3cff','#e8590c','#e0368a'];
let C=Object.assign({theme:'light',glass:'liquid',acc:'#000000',font:'sans'},S.get('cfg',{}));
function applyCfg(){const b=document.body;const dark=C.theme==='dark'||(C.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
 b.dataset.theme=dark?'dark':'light';b.dataset.glass=C.glass;b.dataset.font=C.font;
 const inv=C.acc==='#000000'&&dark&&C.glass!=='game';b.style.setProperty('--pill',inv?'#fff':C.acc);b.style.setProperty('--pillt',inv?'#000':'#fff');
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#0b0b10':'#ffffff'}
function grp(h,k,vals,labels){return `<div class="box glass"><h4>${h}</h4><div class="lang">${vals.map((v,i)=>`<button class="btn ${C[k]===v?'on':''}" data-k="${k}" data-v="${v}">${labels[i]}</button>`).join('')}</div></div>`}
function renderOpts(){const t=tx();
 $('#opts').innerHTML=grp(t.theme,'theme',['light','dark','auto'],t.th)+grp(t.style,'glass',['liquid','frost','game'],t.st)
 +`<div class="box glass"><h4>${t.accent}</h4><div class="lang">${ACC.map(c=>`<button class="btn" data-k="acc" data-v="${c}" style="flex:none;width:44px;height:44px;padding:0;border-radius:50%;background:${c};border:3px solid ${C.acc===c?'var(--ink)':'transparent'}"></button>`).join('')}</div></div>`
 +grp(t.font,'font',['sans','serif','rounded','mono','pixel'],t.fn)}
$('#opts').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;C[b.dataset.k]=b.dataset.v;S.set('cfg',C);applyCfg();renderOpts()};
matchMedia('(prefers-color-scheme:dark)').addEventListener&&matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyCfg);
applyCfg();
// settings
$$('#langs .btn').forEach(b=>b.onclick=()=>{L=b.dataset.l;S.set('lang',L);ui();load()});

// daily refresh: new day, or retry if only sample news is showing
function tick(){if(today()!==LD||(sampleShown&&Date.now()-lastTry>600000))load()}
setInterval(tick,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
$('#sl').textContent=tx().name;$('#sst').textContent=tx().load;
ui();go('news');const t0=Date.now();
const hide=()=>{const e=$('#splash');if(!e)return;e.classList.add('off');setTimeout(()=>e.remove(),700)};
load().then(()=>setTimeout(hide,Math.max(0,1600-(Date.now()-t0)))).catch(hide);setTimeout(hide,120000);
</script>
</body>
</html>
